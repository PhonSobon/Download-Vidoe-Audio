<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YouTube Video &amp; Audio Downloader</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 22px;
    margin-bottom: 8px;
  }
  p.sub {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 24px;
  }
  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 14px;
    box-sizing: border-box;
    margin-bottom: 16px;
  }
  .formats {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .formats label {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #334155;
    cursor: pointer;
    font-size: 14px;
  }
  .formats input {
    display: none;
  }
  .formats input:checked + span {
    color: #38bdf8;
    font-weight: 600;
  }
  .formats label:has(input:checked) {
    border-color: #38bdf8;
    background: #0c2836;
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #38bdf8;
    color: #0f172a;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  #status {
    margin-top: 18px;
    font-size: 14px;
    min-height: 20px;
  }
  #status.error { color: #f87171; }
  #status.ok { color: #4ade80; }
  a.download-link {
    display: inline-block;
    margin-top: 10px;
    color: #38bdf8;
    text-decoration: none;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>YouTube Video &amp; Audio Downloader</h1>
    <p class="sub">Paste a YouTube link, then download it as an MP4 video or MP3 audio file. Public links from other supported sites work too.</p>

    <input type="text" id="url" placeholder="Paste a YouTube video link" />

    <input type="number" id="limitMinutes" min="0" step="0.5"
           placeholder="Only download first N minutes (optional, e.g. 5)" />

    <div class="formats">
      <label>
        <input type="radio" name="fmt" value="mp3" checked>
        <span>🎵 MP3 audio</span>
      </label>
      <label>
        <input type="radio" name="fmt" value="mp4">
        <span>🎬 MP4 video</span>
      </label>
    </div>

    <button id="go">Download MP3 audio</button>
    <div id="status"></div>
  </div>

<script>
const goBtn = document.getElementById('go');
const statusEl = document.getElementById('status');
const urlInput = document.getElementById('url');
const limitInput = document.getElementById('limitMinutes');
const formatInputs = document.querySelectorAll('input[name="fmt"]');

function updateButtonLabel() {
  const fmt = document.querySelector('input[name="fmt"]:checked').value;
  goBtn.textContent = fmt === 'mp4' ? 'Download MP4 video' : 'Download MP3 audio';
}

formatInputs.forEach(input => input.addEventListener('change', updateButtonLabel));

goBtn.addEventListener('click', async () => {
  const url = urlInput.value.trim();
  const fmt = document.querySelector('input[name="fmt"]:checked').value;
  const limitMinutes = limitInput.value.trim();

  statusEl.className = '';
  statusEl.textContent = '';

  if (!url) {
    statusEl.className = 'error';
    statusEl.textContent = 'Please paste a video link first.';
    return;
  }

  goBtn.disabled = true;
  statusEl.textContent = fmt === 'mp4' ? 'Starting video download...' : 'Starting audio download...';

  try {
    const res = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, format: fmt, limit_minutes: limitMinutes || null })
    });
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || 'Something went wrong.');
    }

    const jobId = data.job_id;
    statusEl.textContent = fmt === 'mp4'
      ? 'Downloading and preparing the video... this can take a bit for longer videos.'
      : 'Downloading and converting the audio... this can take a bit for longer videos.';
    poll(jobId);
  } catch (err) {
    statusEl.className = 'error';
    statusEl.textContent = err.message;
    goBtn.disabled = false;
  }
});

async function poll(jobId) {
  try {
    const res = await fetch(`/status/${jobId}`);
    const data = await res.json();

    if (data.status === 'done') {
      statusEl.className = 'ok';
      statusEl.innerHTML = `Done: "${data.title}"<br><a class="download-link" href="/download/${jobId}">Click here to download</a>`;
      goBtn.disabled = false;
      return;
    }
    if (data.status === 'error') {
      statusEl.className = 'error';
      statusEl.textContent = 'Error: ' + data.error;
      goBtn.disabled = false;
      return;
    }
    // still queued/downloading
    setTimeout(() => poll(jobId), 1500);
  } catch (err) {
    statusEl.className = 'error';
    statusEl.textContent = 'Lost connection to server.';
    goBtn.disabled = false;
  }
}
</script>
</body>
</html>
